name: "Hi-oT Smart Home Bridge"
slug: "hiot_bridge"
description: "현대 힐스테이트 Hi-oT 스마트홈 조명, 난방, 에어컨, 환기, 콘센트, 엘리베이터를 Home Assistant로 자동 등록 및 제어하는 MQTT 브릿지"
version: "1.0.4"
url: "https://github.com/lunakillz/ha-hiot-addon"
map:
  - homeassistant_config:rw
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
homeassistant: "2023.1.0"
ingress: true
ingress_port: 8099
panel_icon: "mdi:home-lightning-bolt"
panel_title: "Hi-oT 홈제어"
options:
  hiot_user_id: ""
  hiot_password: ""
  hiot_pin: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  discovery_prefix: "homeassistant"
  topic_prefix: "hiot"
  polling_interval_sec: 30
schema:
  hiot_user_id: str
  hiot_password: password
  hiot_pin: password?
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  discovery_prefix: str
  topic_prefix: str
  polling_interval_sec: int
